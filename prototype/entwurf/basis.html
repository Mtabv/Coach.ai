<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach.AI Teamzentrale Entwurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: feste Seitenleiste mit den Bereichen, rechts der Arbeitsbereich; auf dem Handy Leiste oben als Reiter. */
:root {
  --bg: #f3f5f4;
  --panel: #ffffff;
  --ink: #17221d;
  --muted: #5b6a63;
  --line: #d9e0dc;
  --accent: #1f6f4a;
  --accent-soft: #e2f0e8;
  --game: #b5481f;
  --game-soft: #fbe9e1;
  --warn: #9a6a00;
  --warn-soft: #fff4d6;
  --pitch: #2e7d4f;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111816; --panel: #19221f; --ink: #e6ede9; --muted: #9baba3; --line: #2c3833;
    --accent: #5cc08e; --accent-soft: #1d3329; --game: #f08a5d; --game-soft: #3a2219;
    --warn: #e7b84a; --warn-soft: #362c12; --pitch: #24603e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111816; --panel: #19221f; --ink: #e6ede9; --muted: #9baba3; --line: #2c3833;
  --accent: #5cc08e; --accent-soft: #1d3329; --game: #f08a5d; --game-soft: #3a2219;
  --warn: #e7b84a; --warn-soft: #362c12; --pitch: #24603e; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; } h2 { font-size: 22px; } h3 { font-size: 18px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; background: linear-gradient(to right, var(--panel) 219px, var(--line) 219px 220px, var(--bg) 220px); }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { font-family: var(--display); font-size: 24px; font-weight: 700; padding: 0 10px 2px; }
.team { color: var(--muted); font-size: 14px; padding: 0 10px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.nav a { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.nav a:hover { background: var(--accent-soft); }
.nav a.on { background: var(--accent); color: #fff; }
.nav .badge { font-size: 12px; background: var(--game); color: #fff; border-radius: 10px; padding: 0 7px; }
.who { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 10px 0; font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.who select { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }

main { padding: 20px 28px 40px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.demo { background: var(--warn-soft); color: var(--warn); border: 1px solid currentColor; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.head p { margin: 4px 0 0; color: var(--muted); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card .sub { color: var(--muted); font-size: 14px; margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.pill { display: inline-block; font-size: 13px; border-radius: 20px; padding: 1px 9px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.game { background: var(--game-soft); color: var(--game); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.grey { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 3px 9px; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 12px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.note { font-size: 13px; color: var(--muted); }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.list li:last-child { border-bottom: 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 13px; color: var(--muted); font-weight: 600; }
.scroll { overflow-x: auto; }
input[type="text"], textarea, select.f { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--panel); }
label.fl { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }

/* Kalender */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 230px; display: grid; gap: 8px; align-content: start; }
.day.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day .dh { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
.day .dh b { color: var(--ink); font-size: 15px; }
.ev { border-radius: 8px; padding: 8px; font-size: 14px; display: grid; gap: 4px; overflow-wrap: anywhere; hyphens: auto; }
.ev.tr { background: var(--accent-soft); border: 1px dashed var(--accent); }
.ev.tr.filled { border-style: solid; }
.ev.tr.over { outline: 3px solid var(--accent); }
.ev.tr.pick { cursor: copy; outline: 2px dashed var(--game); }
.ev.gm { background: var(--game-soft); border: 1px solid var(--game); color: var(--ink); }
.ev .t { font-weight: 700; }
.ev .u { background: var(--panel); border-radius: 6px; padding: 4px 6px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.ev .u button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; }
.ev .empty { color: var(--muted); font-size: 13px; }
.inv { position: sticky; top: 16px; }
.unit { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 10px; background: var(--panel); cursor: grab; display: grid; gap: 2px; }
.unit.sel { outline: 2px solid var(--game); }
.unit small { color: var(--muted); }
.month { display: grid; grid-template-columns: repeat(7, minmax(90px, 1fr)); gap: 4px; }
.month .mh { font-size: 13px; color: var(--muted); padding: 2px 6px; }
.mday { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-height: 92px; padding: 4px 6px; font-size: 13px; display: grid; gap: 3px; align-content: start; }
.mday.out { opacity: .45; }
.mday.today { border-color: var(--accent); }
.chip { border-radius: 4px; padding: 1px 5px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.tr { background: var(--accent-soft); color: var(--accent); }
.chip.tr.open { background: transparent; border: 1px dashed var(--accent); }
.chip.gm { background: var(--game-soft); color: var(--game); }

/* Aufstellung */
.lineup { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.pitch { position: relative; background: var(--pitch); border-radius: 10px; aspect-ratio: 105 / 68; overflow: hidden; }
.pitch::before { content: ""; position: absolute; inset: 4%; border: 2px solid rgba(255,255,255,.55); border-radius: 2px; }
.pitch::after { content: ""; position: absolute; left: 50%; top: 4%; bottom: 4%; border-left: 2px solid rgba(255,255,255,.55); }
.pitch .circle { position: absolute; left: 50%; top: 50%; width: 17%; aspect-ratio: 1; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; transform: translate(-50%, -50%); }
.pitch .box { position: absolute; top: 25%; bottom: 25%; width: 15%; border: 2px solid rgba(255,255,255,.55); }
.pitch .box.l { left: 4%; border-left: 0; } .pitch .box.r { right: 4%; border-right: 0; }
.spot { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; z-index: 1; background: none; border: 0; cursor: pointer; padding: 0; }
.spot .dot { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #17221d; display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 2px solid #17221d; }
.spot.active .dot { background: #ffd34d; }
.spot .nm { color: #fff; font-size: 13px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; }
.bench { display: grid; gap: 6px; }
.bench button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 8px; cursor: pointer; display: flex; justify-content: space-between; }
.bench button.out { opacity: .5; cursor: not-allowed; }

/* Bewertung */
.rate { display: inline-flex; gap: 4px; }
.rate button { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; }
.rate button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.q { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }

/* Analytics */
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 170px 1fr 40px; gap: 8px; align-items: center; font-size: 14px; }
.bar .track { background: var(--bg); border-radius: 4px; height: 14px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { height: 100%; background: var(--accent); }
.bar .fill.alt { background: var(--game); }
.spark { width: 100%; height: 60px; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; }
.spark .grid { stroke: var(--line); stroke-width: 1; }
.spark circle { fill: var(--accent); }
.spark text { fill: var(--muted); font-size: 10px; }

@media (max-width: 1150px) { .cal-wrap { grid-template-columns: 1fr; } .inv { position: static; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; background: var(--bg); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; gap: 6px; }
  .team { border: 0; padding: 0 10px 0 0; margin: 0; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
  .who { display: none; }
  main { padding: 16px; }
  .cal-wrap, .lineup { grid-template-columns: 1fr; }
  .inv { position: static; }
  .week { grid-template-columns: 1fr; }
  .day { min-height: 0; }
  .bar { grid-template-columns: 120px 1fr 34px; }
}
@media (prefers-reduced-motion: no-preference) { .nav a, .btn, .seg button { transition: background .15s; } }
/* ---- Runde 2 ---- */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a, .tabs button { padding: 8px 14px; border: 0; background: none; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabs .on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.crumb { font-size: 14px; color: var(--muted); }
.crumb a { color: var(--accent); }
.strip-wrap { overflow-x: auto; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 8px; min-width: 920px; }
.sday { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 120px; }
.sday.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.sday.rest { background: transparent; }
.avail { font-size: 12px; }
.abs { font-size: 12px; color: var(--muted); border-top: 1px dotted var(--line); padding-top: 4px; }
.abs b { color: var(--game); font-weight: 600; }
.ev select { font-size: 13px; padding: 3px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); width: 100%; }
.explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.explain div { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); }
.explain b { display: block; font-family: var(--display); font-size: 18px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chain span.box { border: 1px solid var(--accent); border-radius: 8px; padding: 6px 12px; background: var(--accent-soft); }
.chain span.arr { color: var(--muted); }
.gantt { min-width: 980px; display: grid; gap: 4px; }
.grow { display: grid; grid-template-columns: 200px repeat(15, minmax(44px, 1fr)); gap: 2px; align-items: stretch; }
.grow .lab { font-size: 14px; padding: 6px 4px; font-weight: 600; }
.grow .hc { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0; border-radius: 4px; }
.grow .hc.now { background: var(--accent); color: #fff; }
.grow .hc.pause { font-style: italic; }
.grow .cell { background: var(--bg); border-radius: 4px; min-height: 40px; }
.blk { border-radius: 6px; padding: 4px 8px; font-size: 13px; line-height: 1.25; background: var(--accent); color: #fff; z-index: 1; display: grid; align-content: center; }
.blk.done { background: var(--muted); }
.blk.plan { background: var(--accent-soft); color: var(--accent); border: 1px dashed var(--accent); }
.slide { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); display: grid; }
.slide.off { opacity: .55; }
.slide-h { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.slide-h .no { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 14px/1 var(--body); margin-right: 10px; vertical-align: 2px; }
.slide-b { padding: 14px 16px; display: grid; gap: 12px; }
.fact { display: grid; grid-template-columns: 1fr auto; gap: 8px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 10px; align-items: start; }
.fact.opp { border-left-color: var(--game); }
.fact small { color: var(--muted); display: block; margin-top: 2px; }
.icons { display: flex; gap: 2px; }
.ib { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; color: var(--muted); }
.ib:hover { color: var(--ink); border-color: var(--muted); }
.ib svg { width: 16px; height: 16px; }
.tb { display: grid; gap: 4px; }
.tb .tbh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.mic { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 2px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.mic svg { width: 14px; height: 14px; }
.flash { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); }
.tile .v { font-family: var(--display); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .c { font-size: 13px; color: var(--muted); }
.tile .c b { color: var(--ink); }
.minibar { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; font-size: 13px; }
.minibar .pair { display: grid; gap: 2px; }
.minibar .b1, .minibar .b2 { height: 10px; border-radius: 3px; }
.minibar .b1 { background: var(--game); }
.minibar .b2 { background: var(--muted); opacity: .5; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.prin { display: grid; grid-template-columns: 1fr 120px 150px; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 8px 0; }
.prin:last-child { border-bottom: 0; }
.score { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.games { display: grid; gap: 8px; }
.gamerow { display: grid; grid-template-columns: 90px 1fr 70px auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.droplist { display: grid; gap: 8px; }
.drop { border: 1px dashed var(--accent); border-radius: 8px; padding: 8px 10px; background: var(--accent-soft); display: grid; gap: 2px; font-size: 14px; }
.drop.filled { border-style: solid; }
.drop.over { outline: 3px solid var(--accent); }
.drop.pick { outline: 2px dashed var(--game); cursor: copy; }
@media (max-width: 900px) {
  .prin { grid-template-columns: 1fr; }
  .gamerow { grid-template-columns: 1fr; }
}
/* ---- Runde 6 ---- */
:root { --tr: #2563a8; --tr-soft: #e3edf9; }
:root[data-theme="dark"] { --tr: #8fb8ea; --tr-soft: #1b2a3d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tr: #8fb8ea; --tr-soft: #1b2a3d; } }
.ev { border-left-width: 5px !important; border-left-style: solid !important; }
.ev.tr { background: var(--tr-soft); border-color: var(--tr); }
.ev.tr .t, .chip.tr { color: var(--tr); }
.chip.tr { background: var(--tr-soft); }
.chip.tr.open { background: transparent; border-color: var(--tr); }
.ev.gm .t { color: var(--game); }
.ev.xv .t { color: var(--ev); }
.ev.tr[data-open] { cursor: pointer; }
.ev.tr[data-open]:hover { box-shadow: 0 0 0 2px var(--tr); }
.ev .open-link { font-size: 13px; color: var(--tr); }
.cal-legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.cal-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tcard { border-left: 5px solid var(--tr) !important; }
.tday a { color: inherit; text-decoration: none; }
.tday a:hover { text-decoration: underline; }
.pt.t-tr { border-left: 4px solid var(--tr); } .pt.t-gm { border-left: 4px solid var(--game); } .pt.t-ev { border-left: 4px solid var(--ev); }
.late { font-size: 14px; background: var(--warn-soft); color: var(--ink); border-radius: 6px; padding: 6px 8px; }
select.need { outline: 2px solid var(--game); }
.flowed { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.flowlist { display: grid; gap: 6px; }
.flowrow { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 8px; align-items: center; }
.flowrow.head { font-size: 13px; color: var(--muted); font-weight: 600; }
.flowrow .dur { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); font-size: 14px; }
.flowrow .dur input { width: 70px; }
.flowrow .ib { font-size: 18px; line-height: 1; }
.flowprev { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); display: grid; gap: 6px; }
.flowprev td { padding: 4px 6px; }
.flowprev tr.ko td { font-weight: 700; border-bottom: 0; }
.planpick { max-width: 220px; font-size: 13px; padding: 2px 4px; }
.head svg, .crumb svg, .sub svg { width: 14px; height: 14px; vertical-align: -2px; }
/* Einzeltraining */
.unitview { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.timeline { display: grid; gap: 8px; }
.tl { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: start; border: 1px solid var(--line); border-left: 5px solid var(--tr); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
.tl.warm { border-left-color: var(--muted); }
.tl .tm { font-variant-numeric: tabular-nums; font-weight: 700; }
.tl h4 { margin: 0; font-size: 17px; }
.exdrop { border: 2px dashed var(--tr); border-radius: 8px; padding: 10px; text-align: center; color: var(--tr); font-size: 14px; }
.exdrop.over { background: var(--tr-soft); }
.side-pick { display: grid; gap: 6px; }
.side-pick .it { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--panel); cursor: grab; display: grid; gap: 2px; font-size: 14px; }

<script>
// ======================= Beispieldaten (erfunden) =======================
const TODAY = '2026-11-11';
const players = [

  const tw = players.filter(isTW), fp = players.filter(p=>!isTW(p));
  return { tw: tw.filter(p=>!out.has(p.id)).length, twAll: tw.length, fp: fp.filter(p=>!out.has(p.id)).length, fpAll: fp.length };
}

// Verwaltung: Trainingsrhythmus und Grenzen
const settings = {
  rhythm: [ {wd:2, time:'19:00', dur:90, place:'Sportplatz Schulstraße'}, {wd:4, time:'19:00', dur:90, place:'Sportplatz Schulstraße'} ],
  minFpTr: 12, minFpGm: 13, minTw: 1,
  home: 'Sportplatz Schulstraße (Kunstrasen)',
  flow: {
    heim: [['Treffpunkt: ankommen und umziehen',20],['Kabinenansprache',10],['Aufwärmen',35],['Zurück in die Kabine',10]],
    auswärts: [['Abfahrt Sportplatz Schulstraße',45],['Ankunft: umziehen',20],['Kabinenansprache',10],['Aufwärmen',35],['Zurück in die Kabine',10]],
  },
  kit: {
    'Heim': [['Trikot','grün','#1f6f4a'],['Hose','weiß','#ffffff'],['Stutzen','grün','#1f6f4a']],
    'Auswärts': [['Trikot','weiß','#ffffff'],['Hose','schwarz','#222222'],['Stutzen','weiß','#ffffff']],

  dossierModel: 'beides',
  // Absagefrist je Terminart: Stunden vorher, Uhrzeit am Termintag oder am Vortag
  deadline: { tr: {mode:'hours', val:'6'}, gm: {mode:'prevday', val:'20:00'}, ev: {mode:'hours', val:'24'} },
  phone: '',
};
const DL_TYPES = [['tr','Training'],['gm','Spiel'],['ev','Event']];
const DL_MODES = [['hours','Stunden vorher'],['sameday','Uhrzeit am Termintag'],['prevday','Uhrzeit am Vortag']];
function deadlineOf(e) {
  const d = settings.deadline[e.type], start = new Date(`${e.date}T${e.time}:00`);
  if (d.mode === 'hours') return new Date(start.getTime() - (+d.val||0)*3600e3);
  const day = new Date(`${e.date}T${d.val||'00:00'}:00`); if (d.mode === 'prevday') day.setDate(day.getDate()-1); return day;
}
const fmtDT = dte => `${['So','Mo','Di','Mi','Do','Fr','Sa'][dte.getDay()]} ${String(dte.getDate()).padStart(2,'0')}.${String(dte.getMonth()+1).padStart(2,'0')}. ${String(dte.getHours()).padStart(2,'0')}:${String(dte.getMinutes()).padStart(2,'0')}`;
const REASONS = ['Verletzt','Krank','Arbeit','Uni oder Schule','Urlaub','Familie','Sonstiges'];
const minus = (t, m) => { const [h,mm] = t.split(':').map(Number), x = h*60+mm-m; return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`; };
/** Ablauf rückwärts vom Anstoß rechnen: jede Zeile hat eine Dauer, die letzte endet mit dem Anstoß. */
function flowTimes(rows, kickoff) {
  let total = rows.reduce((s,[,m])=>s+(+m||0),0), out = [];
  for (const [l,m] of rows) { out.push([minus(kickoff,total), l, +m||0]); total -= (+m||0); }
  return out.concat([[kickoff,'Anstoß',0]]);
}
const flowText = g => flowTimes(settings.flow[g.home?'heim':'auswärts'], g.time).map(([t,l])=>`${t} ${l}`).join('\n');
const flowText_old = g => settings.flow[g.home?'heim':'auswärts'].map(([l,m])=>`${minus(g.time,m)} ${l}`).join('\n') + `\n${g.time} Anstoß`;
const kitText = g => settings.kit[g.home?'Heim':'Auswärts'].map(([k,c])=>`${k} ${c}`).join(', ') + `. Aufwärmen: ${settings.warmup}.`;
const RIGHTS = ['Spieltag vorbereiten und nachbereiten','Spielernoten vergeben','Training planen','Kader und Abwesenheiten pflegen','Einstellungen ändern'];
const PV = [['termine','Termine mit Zu- und Absage',true],['kalender','Kalender',false],['training','Geplante Trainingsinhalte (Einheit, Schwerpunkt)',false],
  ['vorbereitung','Spielvorbereitung (Dossier ohne interne Notizen)',false],['nachbereitung','Spielnachbereitung (ohne Noten)',false],

const CHANNELS = [['push','Push aufs Handy'],['mail','E-Mail'],['wa','WhatsApp-Gruppe (Text zum Teilen)']];
const LEAGUE = [
  [1,'SG Nordheim',9,1,2,31,12],[2,'FC Talblick',8,2,2,27,14],[3,'SC Testfeld',8,1,3,24,15],[4,'TSG Wilhelmshöhe',7,1,4,25,18],
  [5,'SV Musterdorf',6,2,4,22,19],[6,'VfB Altstadt',5,4,3,20,17],[7,'SC Neuberg',5,3,4,21,20],[8,'FC Beispielstadt',5,1,6,19,21],
  [9,'TuS Probehausen',4,3,5,19,14],[10,'FV Vorlage',4,1,7,16,22],[11,'TSV Mittelbach',3,3,6,15,21],[12,'Eintracht Hügelland',3,2,7,14,20],
  [13,'FSV Waldrand',3,1,8,13,22],[14,'SV Ostfeld',2,3,7,12,20],[15,'TuS Kleinstadt',2,2,8,11,23],[16,'SC Randgebiet',1,2,9,10,21]];
function leagueTable(rows) {
  return `<div class="scroll"><table class="ltab"><thead><tr><th class="num">Pl.</th><th>Mannschaft</th><th class="num">Sp.</th><th class="num">S</th><th class="num">U</th><th class="num">N</th><th class="num">Tore</th><th class="num">Diff.</th><th class="num">Pkt.</th></tr></thead><tbody>
    ${rows.map(([pl,n,w,d,l,gf,ga])=>`<tr class="${n.startsWith('TSG')?'own':''} ${pl<=2?'up':''} ${pl>=15?'down':''}"><td class="num">${pl}</td><td>${n}</td><td class="num">12</td><td class="num">${w}</td><td class="num">${d}</td><td class="num">${l}</td><td class="num">${gf}:${ga}</td><td class="num">${gf-ga>0?'+':''}${gf-ga}</td><td class="num"><b>${3*w+d}</b></td></tr>`).join('')}</tbody></table></div>`;

const principles = [
  {id:'b1',phase:'Ballbesitz',name:'Flach aufbauen, auch unter Druck',hist:[3,4,3,4,3,4]},

const ROWS = [...PHASES, 'Athletik'];

  {row:'Gegen den Ball', from:0, to:1, title:'Mitte zu', pr:'g1', state:'done'},

const KINDS = ['Spielform','Übungsform','Standard','Athletik','Sonstige'];

function spark(vals,labels,h=60) {
  const w=300,max=5,min=1,xs=i=>14+i*(w-28)/(vals.length-1),ys=v=>8+(max-v)/(max-min)*(h-24);
  return `<svg class="spark" style="height:${h}px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Verlauf">
    ${[1,3,5].map(v=>`<line class="grid" x1="0" x2="${w}" y1="${ys(v)}" y2="${ys(v)}"/>`).join('')}
    <polyline points="${vals.map((v,i)=>`${xs(i)},${ys(v)}`).join(' ')}"/>
    <circle cx="${xs(vals.length-1)}" cy="${ys(vals[vals.length-1])}" r="3.5"/>
    ${labels?labels.map((l,i)=>`<text x="${xs(i)}" y="${h-2}" text-anchor="middle">${l}</text>`).join(''):''}</svg>`;
}

  return `<div class="strip" style="grid-template-columns:${cols}">${days.map(iso=>{
    const evs = events.filter(e=>e.date===iso), abs = absentOn(iso);
    if (!evs.length) return `<div class="sday rest ${iso===TODAY?'today':''}"><b>${WD[dt(iso).getDay()]}</b><span class="note num">${fmt(iso)}</span></div>`;
    return `<div class="sday ${iso===TODAY?'today':''}"><b>${WD[dt(iso).getDay()]} ${fmt(iso)}</b>
      ${evs.map(e=>e.type==='ev' ? `<div class="ev xv"><span class="t">${e.time} ${e.title}</span></div>` : e.type==='gm'
        ? `<div class="ev gm"><span class="t">${e.time} Spiel · ${e.comp.split(',')[0]}</span><span>${gameTitle(e)}</span>${e.res?`<span class="pill game" style="justify-self:start">${e.res}</span>`:availPill(iso,'gm')}</div>`

function monthGrid() {
  const start = '2026-10-26';
  let h = `<div class="month">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="mh">${x}</div>`).join('')}`;
  for (let i=0;i<35;i++) {

    h += `<div class="mday ${iso.slice(5,7)!=='11'?'out':''} ${iso===TODAY?'today':''}"><span class="num">${+iso.slice(8)}</span>${evs.filter(e=>e.type!=='ev'||state.showEv).map(e=>e.type==='ev'?`<span class="chip xv" title="${esc(e.title)}">${e.time} ${esc(e.title)}</span>`:e.type==='gm'

function nextFact(kind) {
  const shown = new Set(facts[kind].filter(f=>f.custom==null).map(f=>f.i));

}

  if (t.id === 'pub') { state.publish = t.checked; render(); }
  else if (t.id === 'exf') { state.exFilter = t.value; render(); }
  else if (t.id === 'exk') { state.exKind = t.value; render(); }
  else if (t.id === 'absbox') { state.showAbs = t.checked; render(); }
  else if (t.id === 'anap') { state.anaPlayer = t.value; render(); }
  else if (d.done) { state.done[d.done] = t.checked; render(); }
  else if (d.assign) { if (t.value) assign(d.assign, t.value); }
  else if (d.inc) { state.include[d.inc] = t.checked; render(); }
  else if (t.id === 'evbox') { state.showEv = t.checked; render(); }
  else if (t.id === 'sysname') { state.sysName = t.value; }
  else if (d.dutyadd) { if (t.value) { duties.find(x=>x.id===d.dutyadd).who.push(t.value); render(); } }
  else if (d.plan) { state.plan[d.plan][+d.i][+d.k] = t.value; }
  else if (d.kitfile) { const f = t.files && t.files[0]; if (f) { state.kitPhoto[d.kitfile] = URL.createObjectURL(f); render(); } }
  else if (t.id === 'wf') { state.weekFocus = t.value === currentFocus.pr ? null : t.value; state.suggest = {}; render(); }
  else if (t.id === 'dm') { settings.dossierModel = t.value; state.model = t.value; }
  else if (d.pv) { state.pv[d.pv] = t.checked; if (d.pv==='note' && !t.checked) state.publish = false; }
  else if (d.right !== undefined) { state.rights[d.right] = t.checked; }
  else if (d.notify) { state.notify[d.notify] = t.checked; }
  else if (d.flow) { const row = settings.flow[d.flow][+d.i]; row[+d.k] = d.k==='1' ? +t.value : t.value; state.plan = {}; render(); }
  else if (d.kickoff) { if (/^\d{1,2}:\d{2}$/.test(t.value)) state.kickoff = t.value.padStart(5,'0'); render(); }
  else if (d.deadline) { settings.deadline[d.deadline][d.k] = d.k==='val' ? t.value : t.value; render(); }
  else if (t.id === 'phone') { settings.phone = t.value; }
  else if (t.id === 'pvnow') { state.pvNow = t.value; render(); }
  else if (d.planpick) { if (t.value) { state.texts[d.planpick] = t.value; render(); } }
  else if (d.kit) { settings.kit[d.kit][+d.i][+d.k] = t.value; for (const k in state.texts) if (k.startsWith('kleidung-')) delete state.texts[k]; render(); }
  else if (d.warm) { settings.warmup = t.value; for (const k in state.texts) if (k.startsWith('kleidung-')) delete state.texts[k]; }
  else if (d.min) { settings[d.min] = Math.max(0, +t.value || 0); render(); }
  else if (d.rh !== undefined) { const r = settings.rhythm[+d.rh]; r[d.k] = (d.k==='wd'||d.k==='dur') ? +t.value : t.value; if (d.k!=='wd') applyRhythm(+d.rh); render(); }
});
document.addEventListener('dragstart', e => { const el = e.target.closest && e.target.closest('[data-unit],[data-dragunit],[data-dragex]'); if (!el) return;
  e.dataTransfer.setData('text/plain', el.dataset.unit || (el.dataset.dragunit ? 'u:'+el.dataset.dragunit : 'x:'+el.dataset.dragex)); });
document.addEventListener('dblclick', e => { const el = e.target.closest && e.target.closest('[data-open]'); if (el && !e.target.closest('select')) { state.trainEv = el.dataset.open; location.hash = 'einheit'; } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('[data-drop],[data-exdrop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('[data-drop],[data-exdrop]'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const x = e.target.closest && e.target.closest('[data-exdrop]');
  if (x) { e.preventDefault(); const v = e.dataTransfer.getData('text/plain'), ev = EV(x.dataset.exdrop);
    if (v.startsWith('x:')) ev.ex = [...exListOf(ev), v.slice(2)]; else if (v) { ev.unit = v.replace(/^u:/,''); ev.ex = null; } render(); return; }
  const d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); const u = e.dataTransfer.getData('text/plain'); if (u && !u.startsWith('x:')) assign(d.dataset.drop, u.replace(/^u:/,'')); } });
// Spieler auf dem Feld verschieben: daraus entsteht ein eigenes System
let drag = null;
document.addEventListener('pointerdown', e => {
  const sp = e.target.closest && e.target.closest('.spot'); const pitch = document.getElementById('pitch');
  if (!sp || !pitch) return;
  drag = { i: +sp.dataset.spot, el: sp, x0: e.clientX, y0: e.clientY, moved: false, rect: pitch.getBoundingClientRect() };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 5) return;
  drag.moved = true; e.preventDefault();
  const x = Math.min(97, Math.max(3, (e.clientX - drag.rect.left) / drag.rect.width * 100));
  const y = Math.min(96, Math.max(4, (e.clientY - drag.rect.top) / drag.rect.height * 100));
  drag.el.style.left = x + '%'; drag.el.style.top = y + '%'; drag.x = x; drag.y = y;
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.moved) {
    if (state.formation !== UNSAVED) { FORMATIONS[UNSAVED] = FORMATIONS[state.formation].map(r=>[...r]); state.formation = UNSAVED; }
    FORMATIONS[UNSAVED][drag.i][1] = Math.round(drag.x); FORMATIONS[UNSAVED][drag.i][2] = Math.round(drag.y);
    state.dragged = true; drag = null; render(); setTimeout(()=>{ state.dragged = false; }, 0); return;
  }
  drag = null;
});
window.addEventListener('hashchange', render);
render();
</script>
