# Prüft jede Änderung. Auf dem Hauptzweig wird danach automatisch auf den eigenen Server aufgespielt.
# Benötigte Repository-Secrets (nur in GitHub hinterlegt, nie im Code):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, optional DEPLOY_KNOWN_HOSTS
name: Prüfen und aufspielen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc -p server/tsconfig.json --noEmit
      - run: npm test

  aufspielen:
    needs: pruefen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Server eingerichtet?
        id: bereit
        run: |
          if [ -z "$HOST" ]; then echo "Noch kein Server hinterlegt, Aufspielen übersprungen."; echo "los=nein" >> "$GITHUB_OUTPUT"; else echo "los=ja" >> "$GITHUB_OUTPUT"; fi
      - name: Zugang vorbereiten
        if: steps.bereit.outputs.los == 'ja'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Schlüssel als Block (-----BEGIN …) oder als eine Zeile (base64 -w0) – beides geht, Windows-Zeilenenden werden entfernt
          if printf '%s' "$KEY" | grep -q 'BEGIN'; then printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519; else printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_ed25519; fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::DEPLOY_SSH_KEY ist kein gültiger Schlüssel – bitte neu kopieren."; exit 1; }
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts; fi
      - name: Aufspielen
        if: steps.bereit.outputs.los == 'ja'
        run: |
          ssh "$USER@$HOST" 'set -e
            cd /opt/coachai
            git fetch --quiet origin main
            git reset --hard origin/main
            cd deploy
            docker compose up -d --build --remove-orphans
            # Caddy liest eine geänderte Caddyfile nur nach einem Neuladen
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || docker compose restart caddy
            # Teamzentrale sofort mit dem neuen Stand bauen (sonst erst beim nächsten Lauf)
            docker compose exec -T app sh -c "date -Iseconds > /daten/neu-bauen" || true
            docker image prune -f >/dev/null
            # Warten, bis die App gesund meldet; sonst Protokoll zeigen und den Lauf rot machen
            for i in $(seq 1 40); do st=$(docker inspect -f "{{.State.Health.Status}}" coachai-app-1 2>/dev/null || echo fehlt); [ "$st" = healthy ] && break; sleep 3; done
            docker compose logs --no-color --tail 15 app
            docker compose ps
            echo "App: $st"; [ "$st" = healthy ]'
