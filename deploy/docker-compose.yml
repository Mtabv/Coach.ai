# 11Plan Version 1 (Trainerteam). Läuft getrennt von allen anderen Diensten auf eigenem Server.
# Start: cd /opt/coachai/deploy && docker compose up -d --build
name: coachai

services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      COACHAI_EINRICHTUNGSSCHLUESSEL: ${COACHAI_EINRICHTUNGSSCHLUESSEL:?fehlt in .env}
      COACHAI_DATENDIENST_KEY: ${COACHAI_DATENDIENST_KEY:?fehlt in .env}
      COACHAI_DATENDIENST_URL: http://datendienst:8000
      COACHAI_ADRESSE: https://${COACHAI_DOMAIN:?fehlt in .env}
      COACHAI_HTTPS: "1"
    volumes:
      - app-daten:/daten
    depends_on: [datendienst]
    networks: [intern]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3

  datendienst:
    build: { context: .., dockerfile: deploy/Dockerfile.datendienst }
    restart: unless-stopped
    environment:
      API_KEY: ${COACHAI_DATENDIENST_KEY}
    volumes:
      - datendienst-cache:/cache
    networks: [intern]
    # Zustand sichtbar in „docker compose ps“ (healthy/unhealthy); hängt er, startet er sich selbst neu.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=10)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  teamzentrale:
    build: { context: .., dockerfile: deploy/Dockerfile.teamzentrale }
    restart: unless-stopped
    environment:
      COACHAI_DATENDIENST_KEY: ${COACHAI_DATENDIENST_KEY}
      INTERVALL: "21600"
    volumes:
      - teamzentrale-arbeit:/arbeit
      - app-daten:/ausgabe
    depends_on: [datendienst]
    networks: [intern]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      COACHAI_DOMAIN: ${COACHAI_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
    depends_on: [app]
    networks: [intern]

networks:
  intern: {}

# Daten liegen in Docker-Volumes auf dem Server (von den Hetzner-Backups erfasst).
volumes:
  app-daten:
  datendienst-cache:
  teamzentrale-arbeit:
  caddy-daten:
